# ==============================================================
# StableSR — Experimento 2
# ==============================================================
# Variable cambiada vs. exp0: función de pérdida L2 (MSE).
# Permite evaluar impacto de pérdida L2 frente a L1+LPIPS.
# ==============================================================

exp_name: stablesr_exp2
scale: 2
epochs: 100
batch_size: 1
accum_steps: 4
lr: 5.0e-5
scheduler: ddim
sampler_steps: 20
loss_type: l2          # <-- cambia vs. exp0 (era l1+lpips)
freeze_unet: true
gradient_checkpointing: true
mixed_precision: fp16
use_xformers: true
seed: 42
