# ==============================================================
# StableSR — Experimento 1
# ==============================================================
# Variable cambiada vs. exp0: scheduler DDPM con 50 pasos.
# Permite evaluar el impacto del proceso de denoising más largo.
# ==============================================================

exp_name: stablesr_exp1
scale: 2
epochs: 100
batch_size: 1
accum_steps: 4
lr: 5.0e-5
scheduler: ddpm        # <-- cambia vs. exp0 (era ddim)
sampler_steps: 50      # <-- cambia vs. exp0 (era 20)
loss_type: l1+lpips
freeze_unet: true
gradient_checkpointing: true
mixed_precision: fp16
use_xformers: true
seed: 42
