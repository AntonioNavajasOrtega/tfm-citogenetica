# ==============================================================
# StableSR — Configuración por defecto (Experimento 0 / base)
# ==============================================================
# Scheduler DDIM 20 steps, pérdida L1+LPIPS, UNet congelado.
# Esta es la configuración de referencia para comparar el resto.
# ==============================================================

exp_name: stablesr_default
scale: 2
epochs: 100
batch_size: 1
accum_steps: 4
lr: 5.0e-5
scheduler: ddim
sampler_steps: 20
loss_type: l1+lpips
freeze_unet: true
gradient_checkpointing: true
mixed_precision: fp16
use_xformers: true
seed: 42
